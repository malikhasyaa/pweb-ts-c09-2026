<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Antrian Rumah Sakit</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="dist/login.js" type="module" defer></script>
</head>
<body>
    <div class="login-container">
        <h1>Masuk</h1>
        <p class="description">
            Halaman ini untuk mengakses Dashboard Admin dan Panel Operator. Layar Kiosk tidak memerlukan login.
        </p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password">
            </div>

            <button type="submit" id="loginBtn">Masuk</button>
            <div id="errorMessage" class="error-message"></div>
        </form>

        <p class="hint">
            Gunakan akun uji dari dummyjson.com/users (contoh username/password tercantum di sana).
        </p>
    </div>
</body>
</html>
